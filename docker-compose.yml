services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-postgres
    environment:
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_password
      POSTGRES_DB: incident_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incident-network

  ollama:
    image: ollama/ollama:latest
    container_name: incident-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - incident-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incident-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://incident_user:incident_password@postgres:5432/incident_db
      DATABASE_TEST_URL: postgresql+asyncpg://incident_user:incident_password@postgres:5432/incident_test_db
      SECRET_KEY: dev-key-do-not-use-in-production-change-me-now-!@#$%^
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      API_HOST: 0.0.0.0
      API_PORT: 8000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: mistral
      FAISS_INDEX_PATH: ./rag/vector_store/incidents.index
      EMBEDDINGS_MODEL: all-MiniLM-L6-v2
      LOG_LEVEL: INFO
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      #ollama:
        #condition: service_healthy
    volumes:
      - ./backend:/app
      - ./rag:/app/rag
    networks:
      - incident-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incident-frontend
    environment:
      API_URL: http://backend:8000
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    networks:
      - incident-network

volumes:
  postgres_data:
  ollama_data:

networks:
  incident-network:
    driver: bridge